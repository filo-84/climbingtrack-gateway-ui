server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's DNS, so the gateway name is resolved when a request arrives.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /display {
        set $upstream gateway:8090;
        proxy_pass http://$upstream;
    }

    location /ranking {
        set $upstream gateway:8090;
        proxy_pass http://$upstream;
    }

    location /actions {
        set $upstream gateway:8090;
        proxy_pass http://$upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
